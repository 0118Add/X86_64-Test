name: R76S-OpenWrt

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write

    steps:
    - name: Show system
      run: |
        echo -e "Total CPU cores\t: $(nproc)"
        cat /proc/cpuinfo | grep 'model name'

    - name: Maximize build space
      uses: smallprogram/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 4608
        root-reserve-mb: 3584
        remove-dotnet: "true"
        remove-android: "true"
        remove-haskell: "true"
        remove-codeql: "true"

    - name: Checkout
      uses: actions/checkout@main

    - name: Init build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo /bin/bash -c "$(curl -sL https://git.io/vokNn)"
        sudo -E apt-fast -y -qq install asciidoc bash bcc bin86 binutils bison bzip2 clang file flex g++ g++-multilib gawk gcc-multilib gettext git gzip help2man intltool libbpf-dev libboost-dev libelf-dev libncurses-dev libssl-dev libthread-queue-any-perl libusb-dev libxml-parser-perl linux-tools-generic llvm make patch perl-modules pkg-config python3-dev python3-pip python3-pyelftools python3-setuptools rsync sharutils swig time unzip util-linux wget xsltproc zlib1g-dev zip zstd
        sudo -E apt-fast -y -qq install dos2unix dwarves jq npm quilt
        sudo -E npm install -g pnpm
        sudo -E npm install -g n
        sudo -E n stable
        pip3 install --user -U pylibfdt --break-system-packages
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo -E git config --global user.name 'GitHub Actions' && git config --global user.email 'noreply@github.com'
        sudo -E git config --global core.abbrev auto
        df -h

    - name: Prepare Mixedwrt
      run: |
        sudo chown -R runner:runner /home/runner/work/X86_64-Test
        cp -r ./SCRIPTS/. ./
        /bin/bash 01_get_ready.sh

    - name: Prepare Package
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        cp -r ../SCRIPTS/. ./
        /bin/bash 02_prepare_package.sh
        /bin/bash 02_target_only.sh
        /bin/bash 04_remove_upx.sh

    - name: QTMDFW4
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        cp -rf ../SEED/R76S/config.seed .config

    - name: Convert Translation
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        /bin/bash 03_convert_translation.sh

    - name: Add ACL
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        /bin/bash 05_create_acl_for_luci.sh -a

    - name: Fix Permissions
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        sudo -E chmod -R 755 ./08_fix_permissions.sh
        /bin/bash 08_fix_permissions.sh

    - name: Make Config
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        make defconfig

    - name: Get Architecture
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        TARGET_DEVICE_ARCH="$(grep "^CONFIG_TARGET_.*_.*=y$" ".config" | head -n 1 | sed 's/^CONFIG_TARGET_//g' | awk -F '_' '{print $1}')"
        echo "TARGET_DEVICE_ARCH=${TARGET_DEVICE_ARCH}-3328" >>$GITHUB_ENV
        latest_release="$(curl -s https://github.com/openwrt/openwrt/tags | grep -Eo "v[0-9\.]+\-*r*c*[0-9]*.tar.gz" | sed -n '/[2-9][5-9]/p' | sed -n 1p | sed 's/.tar.gz//g' | sed 's/v//g')"
        echo "latest_release=${latest_release}" >>$GITHUB_ENV

    #- name: Cache
      #uses: HiGarfield/cachewrtbuild@main
      #with:
        #mixkey: ${{ env.TARGET_DEVICE_ARCH }}
        #prefix: ${{ github.workspace }}/openwrt

    - name: Make Download
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        make download -j50
        make -j$(($(nproc) + 1)) package/network/utils/nftables/refresh V=s

    - name: Compile Openwrt
      working-directory: ${{ github.workspace }}/openwrt
      id: compileopenwrt
      continue-on-error: true
      run: |
        IGNORE_ERRORS=1 make -j$(($(nproc) + 1))
        echo $?

    - name: If Error
      working-directory: ${{ github.workspace }}/openwrt
      if: steps.compileopenwrt.outcome == 'failure'
      run: |
        cat ./.config
        echo '================================================================'
        make -j1 V=s

    - name: Organize files
      id: organize
      run: |
        # 1. 彻底清理并重新创建 artifact 目录
        rm -rf ./artifact/
        mkdir -p ./artifact/
        
        # 2. 打印实际生成的固件列表，方便在日志中排查
        echo "=== 实际生成的固件列表 ==="
        find openwrt/bin/targets/ -type f || echo "没有找到任何编译输出"
        echo "=========================="

        # 3. 容错式移动：文件存在才移动，不存在不报错
        shopt -s nullglob  # 开启 nullglob，当通配符匹配不到文件时变为空字符串，而不是保持原样
        
        # 移动 combined-efi 固件
        files_efi=(openwrt/bin/targets/armsr/armv8*/*combined-efi.img.gz*)
        if [ ${#files_efi[@]} -gt 0 ]; then
          mv "${files_efi[@]}" ./artifact/
        else
          echo "提示：未找到 combined-efi.img.gz 固件"
        fi

        # 移动 rootfs 固件
        files_rootfs=(openwrt/bin/targets/armsr/armv8*/*rootfs.tar.gz*)
        if [ ${#files_rootfs[@]} -gt 0 ]; then
          mv "${files_rootfs[@]}" ./artifact/
        else
          echo "提示：未找到 rootfs.tar.gz 固件"
        fi
        
        # 4. 查看最终整理结果
        echo "=== 收集到的 Artifact 结果 ==="
        cd ./artifact/
        ls -Ahl || echo "Artifact 目录为空"
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: R76S-OpenWrt-Artifact
        path: ./artifact/    

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: ./artifact/*
        tag_name: R76S-OpenWrt-${{ env.latest_release }}
        name: R76S-OpenWrt-${{ env.latest_release }}
        body: Auto-generated release for OpenWrt build.

    - name: Print Disk Space After
      run: df -h
